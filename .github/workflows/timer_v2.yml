name: Caiwei_2_0_Timer
permissions:
  contents: write
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run script
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_PASSWORD: ${{ secrets.QQ_PASSWORD }}
        run: python caiwei_v14.py
