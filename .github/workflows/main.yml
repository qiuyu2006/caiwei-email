name: Daily Email

on:
  schedule:
    - cron: '0 23 * * *' # 国际时间23点 = 北京时间早上7点
  workflow_dispatch: # 允许你手动点测试

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run script
        env:
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
        run: |
          echo "正在检查变量..."
          python caiwei_v14.py
