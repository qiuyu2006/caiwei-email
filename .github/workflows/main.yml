name: Daily Email

on:
  schedule:
    - cron: '0 23 * * *' # 北京时间 07:00
    - cron: '0 3 * * *'  # 北京时间 11:00
    - cron: '0 7 * * *'  # 北京时间 15:00
    - cron: '0 11 * * *' # 北京时间 19:00
    - cron: '0 15 * * *' # 北京时间 23:00
  workflow_dispatch: # 允许你手动点测试

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run script
        env:
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
        run: python caiwei_v14.py
