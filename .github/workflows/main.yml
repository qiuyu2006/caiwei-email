name: Daily Email

on:
  schedule:
    - cron: '0 23 * * *' # 北京时间 07:00
    - cron: '0 2 * * *'  # 北京时间 10:00
    - cron: '0 5 * * *'  # 北京时间 13:00
    - cron: '0 8 * * *'  # 北京时间 16:00
    - cron: '0 11 * * *' # 北京时间 19:00
    - cron: '0 14 * * *' # 北京时间 22:00
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        env:
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
        run: python caiwei_weather.py
