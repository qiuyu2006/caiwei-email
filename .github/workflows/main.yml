name: Daily Email

on:
  schedule:
    - cron: '0 23 * * *' # 国际时间23点 = 北京时间早上7点
  workflow_dispatch: # 允许你手动点测试

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 如果你代码用到了第三方库(比如 requests)，请在项目根目录建一个 requirements.txt，并取消下面这行的注释
          # pip install -r requirements.txt

      - name: Run script
        env:
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
        run: python caiwei_v14.py
