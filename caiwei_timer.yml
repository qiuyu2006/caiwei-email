name: Caiwei_2_0_Timer
on:
  schedule:
    # 国际时间 23,3,7,11,15 点 = 北京时间 7,11,15,19,23 点
    - cron: '0 23,3,7,11,15 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Run script
        run: python caiwei_v14.py
